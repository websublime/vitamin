name: visual-baselines
on: workflow_dispatch                          # spec §6.P.11: dispatched on the PR branch
permissions: { contents: read }               # AM-025 (Phase 00 spec): least-privilege token
jobs:
  baselines:
    runs-on: ubuntu-latest
    timeout-minutes: 30                        # AM-025 (Phase 00 spec)
    steps:                                     # AM-067 (Phase 00 spec): every action is pinned to a full commit SHA (Phase 00 AM-040 pattern)
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false }   # AM-025 (Phase 00 spec): nothing downstream needs git auth
      - name: Setup Bun                        # AM-069 (Phase 00 spec): no job restores or saves the Bun executable in the Actions cache
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with: { bun-version-file: .bun-version, no-cache: true }
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Build                            # the visual project's web server serves the storybook-static this writes
        run: bun run build
      - name: Install Playwright Chromium      # SD98: the visual project runs Chromium only
        run: bunx playwright install --with-deps chromium
      - name: Write visual baselines           # AM-033: off-pair baselines too
        run: bunx playwright test --project=visual --update-snapshots
        env:
          LINE_VISUAL_OFF_PAIRS: '1'
      - name: Upload baselines                 # Phase 00 spec AM-040 pattern pin (deploy-site.yml)
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: visual-baselines
          path: packages/line-components/__tests__/visual/
          if-no-files-found: error
